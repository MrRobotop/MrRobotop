<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="bt bd"><title id="bt">Rishabh Patil</title><desc id="bd">AI engineer and researcher. Co-founder and CEO of Valuren. Works on evaluation for LLM agents, evidence-based claim verification, world models and safe planning, and machine learning for markets.</desc><style>svg{--surface:#f6f8fa;--panel:#ffffff;--border:#d0d7de;--ink:#1f2328;--ink2:#59636e;--muted:#6e7781;--grid:#d8dee4;--track:#cde2fb;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--other:#8c959f;--goodtext:#006300;--good:#0ca30c;--accent:#2a78d6;--accent2:#4a3aa7;--dots:#59636e;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.card{fill:var(--surface);stroke:var(--border)}.panel{fill:var(--panel);stroke:var(--border)}.rule{stroke:var(--grid);stroke-width:1}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}.good{fill:var(--goodtext)}.goodmark{fill:var(--good)}.h{font-size:16px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.other{fill:var(--other)}.track{fill:var(--track)}.fill{fill:var(--s1)}.name{font-size:54px;font-weight:700;letter-spacing:-0.6px;fill:var(--ink)}.role{font-size:20.5px;fill:var(--ink2)}.prompt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:19px;fill:var(--accent);font-weight:600}.focus{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:19px;fill:var(--ink);opacity:0;animation:cycle 15s infinite}.f1{animation-delay:0s}.f2{animation-delay:3s}.f3{animation-delay:6s}.f4{animation-delay:9s}.f5{animation-delay:12s}@keyframes cycle{0%{opacity:0;transform:translateY(6px)}3.00%{opacity:1;transform:translateY(0)}17.00%{opacity:1;transform:translateY(0)}20.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.dot{fill:var(--dots)}.ring{fill:none;stroke:var(--accent);stroke-width:1.2}.breathe{animation:breathe 4.5s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.85}}.traj{fill:none;stroke:url(#tg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 9s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:100;opacity:0}4%{opacity:1}42%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.start{fill:var(--surface);stroke:var(--ink2);stroke-width:1.6}.end{fill:var(--accent);stroke:var(--surface);stroke-width:2;opacity:0;animation:arrive 9s ease-in-out infinite}@keyframes arrive{0%,38%{opacity:0}44%{opacity:1}88%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.focus,.traj,.end,.breathe{animation:none}.f1{opacity:1}.traj{stroke-dashoffset:0;opacity:1}.end{opacity:1}}</style><defs><clipPath id="clip"><rect width="1000" height="250" rx="16"/></clipPath><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.15" opacity=".28"/></pattern><linearGradient id="fade" x1="0" x2="1"><stop offset=".52" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="m"><rect width="1000" height="250" fill="url(#fade)"/></mask><radialGradient id="glow"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.16"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="655" y1="0" x2="880" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs><rect class="card" x="0.5" y="0.5" width="999" height="249" rx="16"/><g clip-path="url(#clip)"><rect width="1000" height="250" fill="url(#dots)" mask="url(#m)"/><circle cx="866" cy="118" r="210" fill="url(#glow)"/><circle class="ring breathe" cx="866" cy="118" r="15" opacity="0.6"/><circle class="ring" cx="866" cy="118" r="30" opacity="0.38"/><circle class="ring" cx="866" cy="118" r="47" opacity="0.24"/><circle class="ring" cx="866" cy="118" r="66" opacity="0.13"/><path class="traj" pathLength="100" d="M655,198 C690,214 712,166 744,170 S792,204 812,168 S838,108 862,106 C882,104 888,126 872,132 C856,138 846,120 858,112 C868,106 880,114 874,122"/><circle class="start" cx="655" cy="198" r="5"/><circle class="end" cx="874" cy="122" r="5.5"/></g><text class="name" x="54" y="110">Rishabh Patil</text><text class="role" x="57" y="150">AI engineer &amp; researcher  ·  Co-founder &amp; CEO, Valuren</text><text class="prompt" x="57" y="203">›</text><text class="focus f1" x="84" y="203">evaluation for LLM agents</text><text class="focus f2" x="84" y="203">evidence-based claim verification</text><text class="focus f3" x="84" y="203">world models and safe planning</text><text class="focus f4" x="84" y="203">machine learning for markets</text><text class="focus f5" x="84" y="203">digital product passports at Valuren</text></svg>
