<svg xmlns="http://www.w3.org/2000/svg" width="840" height="372" viewBox="0 0 840 372" role="img" aria-labelledby="vt"><title id="vt">VeriSci pipeline: claim, retrieve with BM25 and a fine-tuned e5 retriever, select evidence sentences, verify with a calibrated DeBERTa model, return a label with evidence. Retriever Recall@5 0.867. Verifier accuracy 0.905, macro-F1 0.874, expected calibration error 0.024. End to end on SciFact validation: 0.691 accuracy, 0.653 macro-F1.</title><style>svg{--surface:#161b22;--panel:#0d1117;--border:#30363d;--ink:#f0f6fc;--ink2:#9198a1;--muted:#848d97;--grid:#30363d;--track:#104281;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--other:#6e7681;--goodtext:#0ca30c;--good:#0ca30c;--accent:#3987e5;--accent2:#9085e9;--dots:#9198a1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.card{fill:var(--surface);stroke:var(--border)}.panel{fill:var(--panel);stroke:var(--border)}.rule{stroke:var(--grid);stroke-width:1}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}.good{fill:var(--goodtext)}.goodmark{fill:var(--good)}.h{font-size:16px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.other{fill:var(--other)}.track{fill:var(--track)}.fill{fill:var(--s1)}.node{fill:var(--panel);stroke:var(--border)}.node.key{stroke:var(--s1);stroke-width:1.5}.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}.bracket{stroke:var(--muted);stroke-width:1.2;fill:none}</style><rect class="card" x="0.5" y="0.5" width="839" height="371" rx="14"/><text class="h" x="28" y="42">VeriSci · evidence-based claim verification</text><text class="small" x="812" y="42" text-anchor="end">SciFact · numbers from the model cards</text><rect class="node" x="28" y="64" width="128" height="76" rx="10"/><text class="ink" x="92" y="94" font-size="15" font-weight="600" text-anchor="middle">Claim</text><text class="ink2" x="92" y="114" font-size="12.5" text-anchor="middle">a scientific</text><text class="ink2" x="92" y="129" font-size="12.5" text-anchor="middle">statement</text><path class="arrow" d="M163,102 H179"/><path class="head" d="M178,97.5 L185,102 L178,106.5 Z"/><rect class="node key" x="192" y="64" width="128" height="76" rx="10"/><text class="ink" x="256" y="94" font-size="15" font-weight="600" text-anchor="middle">Retrieve</text><text class="ink2" x="256" y="114" font-size="12.5" text-anchor="middle">BM25 +</text><text class="ink2" x="256" y="129" font-size="12.5" text-anchor="middle">fine-tuned e5</text><path class="arrow" d="M327,102 H343"/><path class="head" d="M342,97.5 L349,102 L342,106.5 Z"/><rect class="node" x="356" y="64" width="128" height="76" rx="10"/><text class="ink" x="420" y="94" font-size="15" font-weight="600" text-anchor="middle">Select</text><text class="ink2" x="420" y="114" font-size="12.5" text-anchor="middle">evidence</text><text class="ink2" x="420" y="129" font-size="12.5" text-anchor="middle">sentences</text><path class="arrow" d="M491,102 H507"/><path class="head" d="M506,97.5 L513,102 L506,106.5 Z"/><rect class="node key" x="520" y="64" width="128" height="76" rx="10"/><text class="ink" x="584" y="94" font-size="15" font-weight="600" text-anchor="middle">Verify</text><text class="ink2" x="584" y="114" font-size="12.5" text-anchor="middle">calibrated</text><text class="ink2" x="584" y="129" font-size="12.5" text-anchor="middle">DeBERTa</text><path class="arrow" d="M655,102 H671"/><path class="head" d="M670,97.5 L677,102 L670,106.5 Z"/><rect class="node" x="684" y="64" width="128" height="76" rx="10"/><text class="ink" x="748" y="94" font-size="15" font-weight="600" text-anchor="middle">Verdict</text><text class="ink2" x="748" y="114" font-size="12.5" text-anchor="middle">3-way label</text><text class="ink2" x="748" y="129" font-size="12.5" text-anchor="middle">with evidence</text><path class="bracket" d="M28,152 V159 H812 V152"/><text x="420.0" y="184" font-size="14" text-anchor="middle"><tspan class="ink2">End to end on SciFact validation: </tspan><tspan class="ink" font-weight="600">0.691</tspan><tspan class="ink2"> accuracy · </tspan><tspan class="ink" font-weight="600">0.653</tspan><tspan class="ink2"> macro-F1</tspan></text><rect class="panel" x="28" y="206" width="184" height="118" rx="10"/><circle class="s1" cx="47.5" cy="228" r="3.5"/><text class="muted" x="57" y="232" font-size="12.5">Retriever</text><text class="ink" x="43" y="268" font-size="28" font-weight="600">0.867</text><text class="ink2" x="44" y="290" font-size="13.5">Recall@5, full corpus</text><rect class="track" x="44" y="304" width="152" height="6" rx="3.0"/><rect class="fill" x="44" y="304" width="131.8" height="6" rx="3.0"/><rect class="panel" x="228" y="206" width="184" height="118" rx="10"/><circle class="s1" cx="247.5" cy="228" r="3.5"/><text class="muted" x="257" y="232" font-size="12.5">Verifier</text><text class="ink" x="243" y="268" font-size="28" font-weight="600">0.905</text><text class="ink2" x="244" y="290" font-size="13.5">Accuracy</text><rect class="track" x="244" y="304" width="152" height="6" rx="3.0"/><rect class="fill" x="244" y="304" width="137.6" height="6" rx="3.0"/><rect class="panel" x="428" y="206" width="184" height="118" rx="10"/><circle class="s1" cx="447.5" cy="228" r="3.5"/><text class="muted" x="457" y="232" font-size="12.5">Verifier</text><text class="ink" x="443" y="268" font-size="28" font-weight="600">0.874</text><text class="ink2" x="444" y="290" font-size="13.5">Macro-F1</text><rect class="track" x="444" y="304" width="152" height="6" rx="3.0"/><rect class="fill" x="444" y="304" width="132.8" height="6" rx="3.0"/><rect class="panel" x="628" y="206" width="184" height="118" rx="10"/><circle class="s1" cx="647.5" cy="228" r="3.5"/><text class="muted" x="657" y="232" font-size="12.5">Verifier</text><text class="ink" x="643" y="268" font-size="28" font-weight="600">0.024</text><text class="ink2" x="644" y="290" font-size="13.5">Calibration error (ECE)</text><text class="muted" x="644" y="310" font-size="12.5">lower is better</text><text class="muted" x="28" y="352" font-size="12.5">Verifier metrics on the derived test set. Retrieval over all 5,183 SciFact abstracts.</text></svg>
